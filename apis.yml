aid: nave-bank
name: Nave Bank
description: 'Nave Bank is a digital-first business bank based in Puerto Rico, offering
  FDIC-insured deposit accounts, business savings, and business loans through an easy-to-navigate
  online and mobile banking platform. Its product surface centers on business checking
  ("Cuenta Nave Business"), interest-bearing savings, real-time payments, ACH and wire
  transfers, and mobile check deposit, with a bilingual (Spanish/English) experience and
  human customer support. Nave was surfaced as a portfolio company of Ribbit Capital and
  added to the API Evangelist network. As of this enrichment pass Nave Bank publishes a
  consumer/business banking website and help center but no public developer API, developer
  portal, or API documentation.'
